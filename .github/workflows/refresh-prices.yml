name: Refresh prices

# Runs daily to refresh studio website prices (free — no API key, no secrets).
# Crowd-sourced promo submissions are reviewed separately, by hand with Claude —
# see the README "Weekly review with Claude" section (npm run review -- --prep).

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC daily = 4:00am Singapore
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write # needed to commit refreshed data back to the repo

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Mirror new Google Form submissions into the repo (email-free) so the weekly
      # cloud review — which can't reach docs.google.com — can read them from git.
      # Set repo variable SUBMISSIONS_CSV_URL (Settings → Variables) to enable.
      - name: Sync form submissions
        if: ${{ vars.SUBMISSIONS_CSV_URL != '' }}
        run: node scripts/sync-inbox.mjs
        env:
          SUBMISSIONS_CSV_URL: ${{ vars.SUBMISSIONS_CSV_URL }}

      # Refresh website prices where adapters can parse them (non-destructive by design).
      - name: Scrape studio sites
        run: npm run scrape -- --apply
        continue-on-error: true

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/studios.json data/inbox.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh prices [skip ci]"
            git push
          fi
