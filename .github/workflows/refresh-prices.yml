name: Refresh prices

# Runs daily to refresh studio prices and review crowd-sourced promo tips.
# Requires (Settings → Secrets and variables → Actions):
#   Secret   ANTHROPIC_API_KEY    — your Claude API key (required for the review step)
#   Secret   SUBMISSIONS_CSV_URL  — Google Sheet "Publish to web → CSV" URL (optional)
#   Variable REVIEW_MODEL         — e.g. claude-haiku-4-5 to cut cost (optional; defaults to claude-opus-5)

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC daily = 4:00am Singapore
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write # needed to commit refreshed data back to the repo

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Refresh website prices where adapters can parse them (non-destructive by design).
      - name: Scrape studio sites
        run: npm run scrape -- --apply
        continue-on-error: true

      # Let Claude vet crowd-sourced promo submissions and publish the confident ones.
      - name: Review promo submissions
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: npm run review -- --apply
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBMISSIONS_CSV_URL: ${{ secrets.SUBMISSIONS_CSV_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/studios.json data/reviewed.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh prices [skip ci]"
            git push
          fi
